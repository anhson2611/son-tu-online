<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sơn Tự Online V2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101426;color:#fff;font-family:system-ui}#scene{position:fixed;inset:0}header{position:fixed;top:12px;left:50%;transform:translateX(-50%);text-align:center;z-index:2;color:#f5d78c;text-shadow:0 2px 8px #000}header h1{margin:0;font-size:clamp(20px,4vw,32px)}header p{margin:4px;font-size:12px}.panel{position:fixed;z-index:3;top:90px;background:#20182fe0;border:1px solid #d6b66b66;border-radius:14px;padding:12px;backdrop-filter:blur(8px)}.left{left:10px;width:165px}.right{right:10px;width:160px}.panel h3{margin:0 0 8px;color:#f5d78c;font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}button{border:1px solid #d6b66b66;border-radius:9px;padding:9px 6px;background:#38294c;color:white;font-weight:600;cursor:pointer;font-size:12px}.stat{font-size:12px;margin:8px 0}.bottom{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:5px;background:#20182fe0;padding:8px;border-radius:12px}.toast{display:none;position:fixed;z-index:5;top:75px;left:50%;transform:translateX(-50%);background:#241936;border:1px solid #d6b66b;padding:10px;border-radius:10px}.hint{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);font-size:11px;background:#171326aa;padding:7px 12px;border-radius:20px;white-space:nowrap}@media(max-width:600px){.left{width:140px;left:6px;padding:8px}.right{width:125px;right:6px;padding:8px}.bottom{bottom:6px;flex-wrap:wrap;justify-content:center;max-width:96vw}.hint{bottom:100px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head>
<body><div id="scene"></div><header><h1>🪷 SƠN TỰ ONLINE</h1><p>Không gian tĩnh tâm • Lễ Phật • Thiền định</p></header>
<div class="panel left"><h3>🙏 NGHI LỄ</h3><div class="actions"><button onclick="chapTay()">🙏 Chắp tay</button><button onclick="lePhat()">🌼 Lễ Phật</button><button onclick="thapHuong()">🪔 Thắp hương</button><button onclick="dangHoa()">🌸 Dâng hoa</button><button onclick="thien()">🧘 Thiền</button><button onclick="thinhChuong()">🔔 Thỉnh chuông</button></div></div>
<div class="panel right"><h3>🪷 PHẬT TỬ</h3><div class="stat">Pháp danh: <b id="name">Khách vãng lai</b></div><div class="stat">Công đức: <b id="merit" style="color:#f5d78c">0</b></div><div class="stat">Trạng thái: <span id="status">An nhiên</span></div><button onclick="doiTen()" style="width:100%">✍️ Đổi pháp danh</button></div>
<div class="bottom"><button onclick="move(0,-1)">⬆</button><button onclick="move(-1,0)">⬅</button><button onclick="move(0,1)">⬇</button><button onclick="move(1,0)">➡</button><button onclick="resetView()">🎥 Góc nhìn</button></div><div class="hint">WASD / phím mũi tên để di chuyển • Kéo chuột xoay camera</div><div class="toast" id="toast"></div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x11172b);scene.fog=new THREE.Fog(0x11172b,30,75);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,150);camera.position.set(0,9,22);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.getElementById('scene').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,3,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2.05;controls.minDistance=7;controls.maxDistance=40;
scene.add(new THREE.HemisphereLight(0xffe9c5,0x28304c,2));const sun=new THREE.DirectionalLight(0xffdf9b,3);sun.position.set(-8,15,8);sun.castShadow=true;scene.add(sun);
const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
function box(w,h,d,m,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function cyl(rt,rb,h,m,x,y,z,n=16){let o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),m);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}
const stone=mat(0xaaa5a0),gold=mat(0xd8b15c,.35,.65),wood=mat(0x6b3827),roof=mat(0x34234f),cream=mat(0xf0dfb8),water=mat(0x264c70,.2,.25);
box(48,.5,48,mat(0x4b4654),0,-.3,0);box(5,.08,30,stone,0,.02,5);for(let z=-8;z<20;z+=2.4)box(4.7,.035,1.9,mat(0x77717b),0,.08,z);
box(13,1,9,stone,0,.6,-9);box(11,.35,7.5,wood,0,1.25,-9);box(10,.45,7,cream,0,1.6,-9);
for(let x of [-4.4,-1.5,1.5,4.4])for(let z of [-11.7,-6.3])cyl(.22,.28,3.5,gold,x,3.3,z,12);
box(11,.35,7,wood,0,5.2,-9);let r1=new THREE.Mesh(new THREE.ConeGeometry(8,2.1,4),roof);r1.rotation.y=Math.PI/4;r1.position.set(0,6.35,-9);r1.scale.set(1,.65,.65);scene.add(r1);let r2=new THREE.Mesh(new THREE.ConeGeometry(5.8,1.8,4),roof);r2.rotation.y=Math.PI/4;r2.position.set(0,7.6,-9);r2.scale.set(1,.65,.65);scene.add(r2);cyl(.12,.12,2,gold,0,8.6,-9,10);
const bud=new THREE.Group();scene.add(bud);bud.position.set(0,2.2,-9.2);let bm=mat(0xe9bd62,.35,.25);let bbody=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),bm);bbody.scale.set(1.15,.65,.65);bbody.position.y=.55;bud.add(bbody);let bhead=new THREE.Mesh(new THREE.SphereGeometry(.48,24,20),bm);bhead.position.y=1.45;bud.add(bhead);let halo=new THREE.Mesh(new THREE.TorusGeometry(1.15,.07,12,48),gold);halo.position.set(0,1.45,-.25);bud.add(halo);
for(let x of [-10,10]){let p=new THREE.Mesh(new THREE.CylinderGeometry(3,3,.18,32),water);p.position.set(x,.05,2);scene.add(p);for(let i=0;i<8;i++){let a=i*Math.PI/4,l=new THREE.Mesh(new THREE.SphereGeometry(.28,10,8),mat(0xe98cb8));l.scale.set(1,.35,1);l.position.set(x+Math.cos(a)*1.5,.2,2+Math.sin(a)*1.5);scene.add(l)}}
for(let x of [-7,7])for(let z of [-4,4,12]){cyl(.08,.12,2.5,wood,x,1.25,z,10);box(.7,.65,.7,gold,x,2.65,z);let light=new THREE.PointLight(0xffbd65,1.3,6);light.position.set(x,2.7,z);scene.add(light)}
for(let x of [-15,-12,12,15]){cyl(.25,.4,3,wood,x,1.5,-1,10);for(let j=0;j<5;j++){let s=new THREE.Mesh(new THREE.SphereGeometry(1,12,10),mat(j%2?0x497b62:0x668d70));s.position.set(x+(Math.random()-.5),3.2+j*.35,-1+(Math.random()-.5));s.scale.set(1,.8,1);scene.add(s)}}
// Avatar
const avatar=new THREE.Group();scene.add(avatar);avatar.position.set(0,0,5);const skin=mat(0xe7b991),robe=mat(0xe5bd70),dark=mat(0x5a4736);
const torso=new THREE.Mesh(new THREE.CylinderGeometry(.38,.55,1.25,16),robe);torso.position.y=1.25;avatar.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.29,20,16),skin);head.position.y=2.08;avatar.add(head);
const legL=new THREE.Group();legL.position.set(-.18,.55,0);avatar.add(legL);let leg1=new THREE.Mesh(new THREE.CylinderGeometry(.13,.15,.65,12),dark);leg1.position.y=-.25;legL.add(leg1);const legR=legL.clone();legR.position.x=.18;avatar.add(legR);
const armL=new THREE.Group();armL.position.set(-.42,1.7,0);avatar.add(armL);let upperL=new THREE.Mesh(new THREE.CylinderGeometry(.12,.15,.62,12),robe);upperL.position.y=-.28;armL.add(upperL);const handL=new THREE.Mesh(new THREE.SphereGeometry(.12,12,10),skin);handL.position.y=-.62;armL.add(handL);const armR=armL.clone();armR.position.x=.42;avatar.add(armR);
const incense=new THREE.Group();let stick=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.55,8),mat(0x9c6541));stick.position.y=.28;incense.add(stick);let ember=new THREE.PointLight(0xff5522,.5,1);ember.position.y=.58;incense.add(ember);incense.position.set(0,1.85,.4);avatar.add(incense);incense.visible=false;let flower=new THREE.Mesh(new THREE.SphereGeometry(.22,12,8),mat(0xf28bb7));flower.position.set(0,1.8,.45);avatar.add(flower);flower.visible=false;
let merit=0,busy=false,walkT=0,meditating=false;const toast=s=>{let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1800)};function gain(s){merit+=10;document.getElementById('merit').textContent=merit.toLocaleString('vi-VN');document.getElementById('status').textContent=s;toast(s+' • +10 công đức')}
window.chapTay=()=>{armL.rotation.set(-.2,0,-.9);armR.rotation.set(-.2,0,.9);handL.position.set(0,-.58,.12);gain('Chắp tay cầu nguyện')};
window.lePhat=async()=>{if(busy)return;busy=true;meditating=false;for(let i=0;i<3;i++){avatar.position.y=-.25;avatar.rotation.x=-.55;head.rotation.x=-.3;await new Promise(r=>setTimeout(r,450));avatar.rotation.x=-1.05;head.rotation.x=-.5;await new Promise(r=>setTimeout(r,550));avatar.rotation.x=-.45;head.rotation.x=0;await new Promise(r=>setTimeout(r,350))}avatar.rotation.x=0;avatar.position.y=0;gain('Hoàn thành lễ Phật');busy=false};
window.thapHuong=()=>{incense.visible=!incense.visible;gain(incense.visible?'Thắp hương':'Hạ hương')};window.dangHoa=()=>{flower.visible=!flower.visible;gain(flower.visible?'Dâng hoa':'Thu hoa')};window.thien=()=>{meditating=!meditating;avatar.position.y=meditating?-.25:0;legL.rotation.x=meditating?-1.2:0;legR.rotation.x=meditating?-1.2:0;gain(meditating?'An tọa thiền định':'Kết thúc thiền')};window.thinhChuong=()=>{toast('🔔 Tiếng chuông ngân vang');gain('Thỉnh chuông')};window.doiTen=()=>{let n=prompt('Nhập pháp danh:');if(n&&n.trim())document.getElementById('name').textContent=n.trim()};
window.move=(x,z)=>{avatar.position.x=Math.max(-18,Math.min(18,avatar.position.x+x));avatar.position.z=Math.max(-15,Math.min(18,avatar.position.z+z));walkT+=1;armL.rotation.x=Math.sin(walkT)*.5;armR.rotation.x=-Math.sin(walkT)*.5;legL.rotation.x=-Math.sin(walkT)*.5;legR.rotation.x=Math.sin(walkT)*.5;controls.target.x=avatar.position.x;controls.target.z=avatar.position.z-2};window.resetView=()=>{camera.position.set(0,9,22);controls.target.set(0,3,0)};
addEventListener('keydown',e=>{if(['ArrowUp','w','W'].includes(e.key))move(0,-.7);if(['ArrowDown','s','S'].includes(e.key))move(0,.7);if(['ArrowLeft','a','A'].includes(e.key))move(-.7,0);if(['ArrowRight','d','D'].includes(e.key))move(.7,0)});
const particles=[];for(let i=0;i<70;i++){let q=new THREE.Mesh(new THREE.SphereGeometry(.035,6,6),mat(0xffdf9a));q.position.set((Math.random()-.5)*32,Math.random()*9,(Math.random()-.5)*28);scene.add(q);particles.push(q)}let clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let t=clock.getElapsedTime();particles.forEach((p,i)=>{p.position.y+=Math.sin(t+i)*.002;p.position.x+=Math.sin(t*.4+i)*.001});if(meditating)avatar.rotation.y=Math.sin(t*.3)*.04;controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
