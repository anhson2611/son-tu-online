<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sơn Tự Online | Chùa Việt 3D</title>
<meta name="description" content="Không gian chùa Việt 3D – lễ Phật, thiền định, thắp hương và giao lưu Phật tử.">
<style>
:root{--gold:#e9c66b;--ink:#17251e;--glass:rgba(15,25,22,.78)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.panel{background:var(--glass);border:1px solid #ffffff25;backdrop-filter:blur(12px);border-radius:14px;padding:12px;box-shadow:0 8px 30px #0003}
#brand{position:fixed;top:14px;left:14px;font-weight:800;color:var(--gold);letter-spacing:.5px}
#status{position:fixed;top:14px;right:14px;font-size:12px;color:#b9e9c8}
#actions{position:fixed;left:14px;bottom:14px;display:flex;flex-wrap:wrap;gap:8px;max-width:min(600px,80vw)}
button{border:1px solid #ffffff25;background:#253b31;color:#fff;padding:10px 13px;border-radius:10px;font-weight:600;cursor:pointer}
button:hover{background:#385944}button.gold{background:#a57c2a;color:#fff}
#chat{position:fixed;right:14px;bottom:14px;width:290px;max-width:45vw}
#messages{height:130px;overflow:auto;font-size:12px;line-height:1.5;margin-bottom:8px}
#chatrow{display:flex;gap:5px}input{min-width:0;flex:1;border-radius:8px;border:1px solid #ffffff30;background:#101b17;color:white;padding:9px}
#login{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#07140b99,#07140bcc)}
#login .panel{width:min(360px,90vw);text-align:center}#login h1{color:var(--gold);font-size:25px}
#login input{width:100%;margin:8px 0}
#hint{position:fixed;top:55px;left:14px;font-size:12px;color:#fff9}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:#111d17ed;border:1px solid #e9c66b66;padding:12px 18px;border-radius:12px;display:none}
#mobile{position:fixed;left:14px;bottom:170px;display:none;gap:6px}
#mobile button{width:48px;height:48px;padding:0;font-size:18px}
@media(max-width:700px){#chat{right:10px;bottom:10px;width:48vw}#messages{height:90px}#actions{left:10px;bottom:145px;max-width:95vw}#actions button{padding:8px;font-size:12px}#mobile{display:grid;grid-template-columns:repeat(3,48px)}#hint{top:48px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="game"></div><div id="brand">🪷 SƠN TỰ ONLINE</div><div id="status">Chế độ Offline · 1 Phật tử</div>
<div id="hint">PC: WASD di chuyển · Chuột xoay camera · Điện thoại: nút điều khiển</div>
<div id="actions">
<button onclick="ritual('bow')">🙏 Lễ Phật</button><button onclick="ritual('hands')">🧎 Chắp tay</button>
<button onclick="ritual('meditate')">🧘 Thiền</button><button onclick="ritual('incense')">🪔 Thắp hương</button>
<button onclick="ritual('flower')">🌸 Dâng hoa</button><button onclick="bell()">🔔 Thỉnh chuông</button>
<button onclick="resetPlayer()">🏯 Về sân chùa</button>
</div>
<div id="mobile"><button style="grid-column:2" data-k="w">▲</button><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div>
<div id="chat" class="panel"><b>💬 Phòng Phật tử</b><div id="messages"><div>Hệ thống: Hoan nghênh bạn đến Sơn Tự Online.</div></div><div id="chatrow"><input id="chatInput" placeholder="Nhập lời chúc an lành…"><button id="send">Gửi</button></div></div>
<div id="toast"></div>
<div id="login"><div class="panel"><h1>🪷 Sơn Tự Online</h1><p>Không gian chùa Việt 3D</p><input id="nameInput" maxlength="24" placeholder="Tên Phật tử / pháp danh"><button class="gold" id="enter">Vào chùa</button><p style="font-size:12px;color:#bbb">Bản V1–V7 · Offline mặc định</p></div></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
// V1: core scene + V2: Vietnamese temple environment
const host=document.getElementById('game');
const scene=new THREE.Scene();scene.background=new THREE.Color('#9bc6d6');scene.fog=new THREE.Fog('#9bc6d6',35,100);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,300);camera.position.set(9,8,13);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,2,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.48;controls.minDistance=4;controls.maxDistance=24;
scene.add(new THREE.HemisphereLight(0xffffff,0x526344,2));
const sun=new THREE.DirectionalLight(0xfff2d5,3);sun.position.set(12,20,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
function mat(color,rough=.8){return new THREE.MeshStandardMaterial({color,roughness:rough})}
function box(parent,x,y,z,w,h,d,m){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function cyl(parent,x,y,z,r1,r2,h,m,n=12){let o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,n),m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
function roof(parent,x,y,z,w,d,color='#8d2922'){
 const g=new THREE.Group();g.position.set(x,y,z);parent.add(g);let m=mat(color);
 // two sloped roof planes + ridge; stylized Vietnamese tiled roof
 let a=box(g,0,.25,0,w,.18,d,m);a.rotation.z=.12;
 let b=box(g,0,.25,0,w,.18,d,m);b.rotation.z=-.12;
 box(g,0,.48,0,w*.12,.22,d*.95,mat('#5e201b'));
 for(let i=-4;i<=4;i++){let e=box(g,i*w/9,.05,d*.48,w/11,.16,.16,mat('#68231d'));e.rotation.z=i<0?.12:-.12}
 return g;
}
const ground=mat('#b9a88a');box(scene,0,-.35,0,100,.5,100,ground);
const stone=mat('#d7d1c4'),wood=mat('#7a3d22'),red=mat('#9c2923'),gold=mat('#d8b65c'),wall=mat('#e8dfc9');
// courtyard tiles
for(let x=-20;x<=20;x+=2)for(let z=-20;z<=20;z+=2)box(scene,x,-.08,z,1.94,.04,1.94,mat((Math.abs(x+z)%4<1)?'#b9ad98':'#c9bda8'));
// temple hall
box(scene,0,1.4,-7,12,2.8,8,wall);
for(let x=-5;x<=5;x+=2.5){cyl(scene,x,1.5,-2.9,.22,.22,3,red,10);cyl(scene,x,1.5,-2.9,.26,.26,.18,gold,10)}
box(scene,0,2.9,-7,12.5,.3,8.5,wood);roof(scene,0,4,-7,14,10);
box(scene,0,1,-2.85,3.5,2,.15,wood);box(scene,0,1.9,-2.75,2.5,.15,.15,gold);
// Buddha statue (stylized)
const statue=new THREE.Group();statue.position.set(0,0,-9);scene.add(statue);
cyl(statue,0,.45,0,1.2,.8,.7,mat('#b88945'));cyl(statue,0,1.05,0,.65,.65,.5,gold);
let body=new THREE.Mesh(new THREE.SphereGeometry(.65,24,18),mat('#d7a66d'));body.position.set(0,2,0);body.scale.set(1,.9,.7);statue.add(body);
let head=new THREE.Mesh(new THREE.SphereGeometry(.42,24,20),mat('#d7a66d'));head.position.set(0,2.9,0);statue.add(head);
cyl(statue,0,3.28,0,.28,.28,.22,mat('#6b3923')); // ushnisha
// gate + pillars
for(let x of [-7,7]){box(scene,x,2,5,.6,4,.6,red);cyl(scene,x,4.2,5,.5,.35,.5,gold);box(scene,x,4.5,5,1.5,.3,1.2,wood)}
box(scene,0,4.1,5,14,.45,.7,red);roof(scene,0,4.7,5,15,2,'#76231e');
// lotus pond
const water=new THREE.Mesh(new THREE.CircleGeometry(4,48),new THREE.MeshStandardMaterial({color:'#5cabb5',transparent:true,opacity:.8,roughness:.2}));water.rotation.x=-Math.PI/2;water.position.set(10,.02,-8);scene.add(water);
for(let i=0;i<12;i++){let a=i*Math.PI/6;let leaf=new THREE.Mesh(new THREE.CircleGeometry(.35,12),mat('#4c985e'));leaf.rotation.x=-Math.PI/2;leaf.position.set(10+Math.cos(a)*2,.06,-8+Math.sin(a)*2);scene.add(leaf);let fl=cyl(scene,10+Math.cos(a)*2,.13,-8+Math.sin(a)*2,.12,.12,.08,mat('#ed9bc5'));}
// trees
function tree(x,z){cyl(scene,x,1,z,.22,.35,2,wood);let crown=new THREE.Mesh(new THREE.SphereGeometry(1.5,12,10),mat('#3d8050'));crown.position.set(x,3,z);crown.castShadow=true;scene.add(crown)}
for(let p of [[-12,-10],[-14,0],[-12,12],[14,10],[15,0],[13,-15]])tree(...p);
// V3 avatar, simple robe character (procedural)
function makeAvatar(color='#b94b37'){
 let g=new THREE.Group(),robe=mat(color),skin=mat('#e5b58c'),dark=mat('#332a23');
 let torso=new THREE.Mesh(new THREE.CylinderGeometry(.38,.55,1.25,12),robe);torso.position.y=1.55;g.add(torso);
 let head=new THREE.Mesh(new THREE.SphereGeometry(.28,16,12),skin);head.position.y=2.45;g.add(head);
 let cap=new THREE.Mesh(new THREE.SphereGeometry(.29,16,8,0,Math.PI*2,0,Math.PI*.45),dark);cap.position.y=2.58;g.add(cap);
 let arms=[];for(let s of [-1,1]){let a=new THREE.Mesh(new THREE.CylinderGeometry(.12,.14,.75,8),robe);a.position.set(s*.48,1.65,0);a.rotation.z=s*.35;g.add(a);arms.push(a)}
 let legs=[];for(let s of [-1,1]){let l=new THREE.Mesh(new THREE.CylinderGeometry(.17,.2,.65,8),robe);l.position.set(s*.2,.45,0);g.add(l);legs.push(l)}
 g.userData={torso,arms,legs,head};return g;
}
const avatar=makeAvatar();scene.add(avatar);avatar.position.set(0,0,2);
let displayName='Phật tử',keys={},mobile={},ritualMode='idle',ritualT=0;
const remotes=new Map();
function remoteAvatar(id,name,x,z){let a=makeAvatar('#557bb5');a.position.set(x,0,z);scene.add(a);return a}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',2400)}
function msg(n,t){let e=document.createElement('div');e.textContent=n+': '+t;let m=document.getElementById('messages');m.append(e);m.scrollTop=m.scrollHeight;while(m.children.length>40)m.firstChild.remove()}
window.ritual=(m)=>{ritualMode=m;ritualT=0;let texts={bow:'Bạn thành kính lễ Phật 🙏',hands:'Bạn chắp tay cung kính',meditate:'Bạn bắt đầu thiền định',incense:'Bạn đang thắp hương 🪔',flower:'Bạn dâng hoa sen 🌸'};toast(texts[m]||m);msg('Nghi lễ',displayName+' — '+texts[m]);if(m==='incense'||m==='flower')effect(m==='incense'?'#f5d79c':'#ed9bc8')};
window.bell=()=>{toast('🔔 Tiếng chuông chùa ngân vang');msg('Chuông','Kính mời an trú trong chánh niệm');try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=420;g.gain.setValueAtTime(.18,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+2.5);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+2.5)}catch(e){}};
window.resetPlayer=()=>{avatar.position.set(0,0,2);toast('Đã về sân chùa')};
const particles=[];function effect(color){for(let i=0;i<24;i++){let p=new THREE.Mesh(new THREE.SphereGeometry(.06,8,8),new THREE.MeshBasicMaterial({color}));p.position.copy(avatar.position).add(new THREE.Vector3((Math.random()-.5)*1.5,1+Math.random(),(Math.random()-.5)*1.5));scene.add(p);particles.push({p,v:new THREE.Vector3((Math.random()-.5)*.025,.025+Math.random()*.025,0),life:100})}}
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();mobile[k]=true};['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>mobile[k]=false))});
document.getElementById('send').onclick=send;document.getElementById('chatInput').onkeydown=e=>{if(e.key==='Enter')send()};
function send(){let i=document.getElementById('chatInput'),t=i.value.trim();if(t){msg(displayName,t);i.value=''}}
document.getElementById('enter').onclick=()=>{displayName=document.getElementById('nameInput').value.trim()||'Phật tử';document.getElementById('login').style.display='none';msg('Hệ thống','Chào '+displayName+'! Chúc bạn an lạc.');toast('Đã vào Sơn Tự Online')};
// V4 Multiplayer: ready to add Supabase credentials; currently offline demo
// V5 rituals/chat local; V6 mobile/desktop controls; V7 deployment-ready static file.
function animate(dt){let f=keys.w||keys.arrowup||mobile.w,b=keys.s||keys.arrowdown||mobile.s,l=keys.a||keys.arrowleft||mobile.a,r=keys.d||keys.arrowright||mobile.d;let x=(r?1:0)-(l?1:0),z=(b?1:0)-(f?1:0);if(x||z){let v=new THREE.Vector3(x,0,z).normalize().multiplyScalar(dt*4);avatar.position.add(v);avatar.rotation.y=Math.atan2(v.x,v.z);if(ritualMode==='idle')ritualMode='walk'}else if(ritualMode==='walk')ritualMode='idle';
avatar.position.x=THREE.MathUtils.clamp(avatar.position.x,-24,24);avatar.position.z=THREE.MathUtils.clamp(avatar.position.z,-24,24);
ritualT+=dt;let u=avatar.userData;if(ritualMode==='bow'){u.torso.rotation.x=Math.sin(Math.min(ritualT/.7,1)*Math.PI)*.65;if(ritualT>1.4){ritualMode='idle';u.torso.rotation.x=0}}else if(ritualMode==='meditate'){avatar.position.y=Math.sin(ritualT*2)*.025;u.legs.forEach(a=>a.rotation.x=.5)}else{avatar.position.y=0;u.legs.forEach(a=>a.rotation.x=ritualMode==='walk'?Math.sin(ritualT*8)*.5:0);u.arms.forEach((a,i)=>a.rotation.z=(i?-.25:.25)+(ritualMode==='walk'?Math.sin(ritualT*8)*.4:0))}
controls.target.lerp(new THREE.Vector3(avatar.position.x,1.6,avatar.position.z),.05);controls.update();
for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.p.position.add(q.v);if(--q.life<=0){scene.remove(q.p);particles.splice(i,1)}}
renderer.render(scene,camera)}
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);animate(Math.min(clock.getDelta(),.05))}loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
