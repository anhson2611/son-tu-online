
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sơn Tự Online</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#101322;color:white;font-family:Arial,sans-serif;overflow:hidden}
#scene{position:fixed;inset:0}
canvas{display:block}
.panel{background:#17172ae8;border:1px solid #ffffff30;border-radius:15px;padding:12px}
.top{position:fixed;top:12px;left:12px}
.top b{font-size:26px;color:#ffd36a}
.left{position:fixed;left:12px;top:110px;display:grid;gap:8px}
button{background:#211e35;color:white;border:1px solid #ffffff30;border-radius:12px;padding:12px 16px;font-size:15px;cursor:pointer}
button:hover{background:#a66b1d}
.counter{position:fixed;right:12px;top:12px}
.bottom{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
#toast{position:fixed;top:100px;left:50%;transform:translateX(-50%);display:none}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="scene"></div>

<div class="top panel">
<b>🪷 Sơn Tự Online</b><br>
Không gian tu học và lễ Phật trực tuyến
</div>

<div class="left">
<button onclick="act('🙏 Lễ Phật')">🙏 Lễ Phật</button>
<button onclick="act('🪷 Niệm Phật')">🪷 Niệm Phật</button>
<button onclick="act('🕯️ Thắp hương')">🕯️ Thắp hương</button>
<button onclick="act('🌸 Dâng hoa')">🌸 Dâng hoa</button>
<button onclick="act('🔔 Thỉnh chuông')">🔔 Thỉnh chuông</button>
<button onclick="act('🧘 Thiền')">🧘 Thiền</button>
</div>

<div class="counter panel">🌿 Công đức<br><b id="merit">0</b></div>
<div id="toast" class="panel"></div>

<div class="bottom">
<button onclick="diChuyen(0,-1)">🚶 Đi tới</button>
<button onclick="diChuyen(0,1)">🚶 Đi lui</button>
<button onclick="lePhat()">🙏 Quỳ lạy</button>
<button onclick="move(0,1)">⬆ Tiến</button>
<button onclick="move(-1,0)">⬅ Trái</button>
<button onclick="move(1,0)">➡ Phải</button>
<button onclick="move(0,-1)">⬇ Lùi</button>
<button onclick="resetView()">🏯 Chính điện</button>
</div>
  
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color('#91b9d8');
scene.fog = new THREE.Fog('#91b9d8',30,90);

const camera = new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,150);
camera.position.set(0,8,20);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
document.querySelector('#scene').appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.target.set(0,3,0);
controls.enableDamping=true;
controls.maxPolarAngle=Math.PI/2.05;
controls.minDistance=7;
controls.maxDistance=35;

scene.add(new THREE.HemisphereLight(0xffe7c5,0x43536a,2));

const sun=new THREE.DirectionalLight(0xffd89a,3);
sun.position.set(-8,16,8);
sun.castShadow=true;
scene.add(sun);

function material(c,r=.7,m=0){
return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
}

const gold=material('#dca83f',.3,.6);
const wood=material('#54251a');
const red=material('#9d2e22');
const stone=material('#b9b4a8');
const green=material('#426b48');
const water=material('#4e9da9',.2,.3);

function box(x,y,z,sx,sy,sz,mat){
const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
o.position.set(x,y,z);
o.castShadow=true;
o.receiveShadow=true;
scene.add(o);
return o;
}

// Sân chùa
box(0,-.35,0,70,.6,70,green);
box(0,-.02,8,5,.12,24,stone);

// Đường đá
for(let z=-2;z<19;z+=2){
box(0,.06,z,4.8,.04,.08,material('#8f887e'));
}

// Hồ sen
for(const x of [-9,9]){
box(x,0,5,5,.18,13,stone);
box(x,.12,5,4.6,.08,12.6,water);

for(let i=0;i<14;i++){
let p=new THREE.Mesh(
new THREE.SphereGeometry(.35,12,8),
material(i%2?'#f5a8c5':'#f7d6e6')
);
p.scale.set(1,.18,.65);
p.position.set(x+(Math.random()-.5)*3,.3,Math.random()*11-1);
scene.add(p);
}
}

// Chính điện
box(0,.4,-4,17,.8,9,stone);
box(0,.9,-4,16,.25,8,wood);
box(0,3,-4,13,4,6,wood);
box(0,5.15,-4,14,.25,6.5,gold);

// Cột gỗ
for(let x=-5.5;x<=5.5;x+=2.75){
for(let z of [-6.5,-1.5]){
let c=new THREE.Mesh(
new THREE.CylinderGeometry(.22,.28,4.2,12),red
);
c.position.set(x,3,z);
scene.add(c);

let cap=new THREE.Mesh(
new THREE.CylinderGeometry(.4,.35,.2,12),gold
);
cap.position.set(x,5.1,z);
scene.add(cap);
}
}

// Mái chùa
function roof(y,w,d){
let g=new THREE.ConeGeometry(w,1.25,4);
g.rotateY(Math.PI/4);
let r=new THREE.Mesh(g,red);
r.position.set(0,y,-4);
r.scale.set(1,1,d/w);
scene.add(r);
}

roof(6.1,9,6.5);
roof(7.4,6.7,5);
roof(8.5,4.5,3.8);

// Tượng Phật vàng
const bud=new THREE.Group();

let body=new THREE.Mesh(
new THREE.SphereGeometry(1,32,24),gold
);
body.scale.set(.9,1.25,.65);
body.position.y=2.2;
bud.add(body);

let head=new THREE.Mesh(
new THREE.SphereGeometry(.55,24,20),gold
);
head.position.y=3.55;
bud.add(head);

let halo=new THREE.Mesh(
new THREE.TorusGeometry(1.25,.09,12,64),gold
);
halo.position.set(0,3.2,-.2);
bud.add(halo);

let base=new THREE.Mesh(
new THREE.CylinderGeometry(1.5,1.8,.55,32),
material('#b66a22')
);
base.position.y=.65;
bud.add(base);

bud.position.set(0,1.4,-3.6);
scene.add(bud);

// Đèn lồng
for(let x of [-7,-4,4,7]){
let pole=new THREE.Mesh(
new THREE.CylinderGeometry(.06,.1,3,8),wood
);
pole.position.set(x,1.5,1);
scene.add(pole);

let lamp=new THREE.Mesh(
new THREE.SphereGeometry(.35,16,12),
material('#ffce65',.2)
);
lamp.position.set(x,3.1,1);
scene.add(lamp);

let light=new THREE.PointLight('#ffbd58',1.5,7);
light.position.copy(lamp.position);
scene.add(light);
}

// Cây hoa
for(let x of [-13,13,-10,10]){
let trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.25,.5,5,8),wood
);
trunk.position.set(x,2.5,-1);
scene.add(trunk);

for(let i=0;i<18;i++){
let b=new THREE.Mesh(
new THREE.SphereGeometry(1.1,8,8),
material(i%2?'#f4a6c9':'#f8c8dc')
);
b.scale.set(.7,.5,.7);
b.position.set(
x+(Math.random()-.5)*4,
4.5+Math.random()*2,
-1+(Math.random()-.5)*3
);
scene.add(b);
}
}

/* NHÂN VẬT PHẬT TỬ 3D */
const phatTu = new THREE.Group();

const aoTrang = new THREE.MeshStandardMaterial({
  color:'#f2dfbd',
  roughness:.8
});

const da = new THREE.MeshStandardMaterial({
  color:'#e8bd98'
});

// Thân
const than = new THREE.Mesh(
  new THREE.CylinderGeometry(.35,.5,1.3,16),
  aoTrang
);
than.position.y=1.1;
phatTu.add(than);

// Đầu
const dau = new THREE.Mesh(
  new THREE.SphereGeometry(.35,24,20),
  da
);
dau.position.y=2;
phatTu.add(dau);

// Hai tay
for(let x of [-.42,.42]){
  let tay=new THREE.Mesh(
    new THREE.CylinderGeometry(.12,.15,.8,12),
    aoTrang
  );
  tay.position.set(x,1.35,0);
  tay.rotation.z=x>0?-.4:.4;
  phatTu.add(tay);
}

// Hai chân
for(let x of [-.22,.22]){
  let chan=new THREE.Mesh(
    new THREE.BoxGeometry(.25,.6,.35),
    aoTrang
  );
  chan.position.set(x,.35,.1);
  phatTu.add(chan);
}

phatTu.position.set(0,0,5);
scene.add(phatTu);

// Quỳ lạy
window.lePhat=()=>{
  phatTu.rotation.x=-.7;
  setTimeout(()=>phatTu.rotation.x=0,1200);
};

// Di chuyển
window.diChuyen=(x,z)=>{
  phatTu.position.x+=x;
  phatTu.position.z+=z;
};

// Cánh hoa lấp lánh
const petals=[];
for(let i=0;i<80;i++){
let p=new THREE.Mesh(
new THREE.SphereGeometry(.045,6,6),
material('#ffd98b')
);
p.position.set(
(Math.random()-.5)*30,
Math.random()*8,
(Math.random()-.5)*25
);
scene.add(p);
petals.push(p);
}

// Điều khiển camera
window.move=(x,z)=>{
controls.target.x+=x;
controls.target.z-=z;
camera.position.x+=x;
camera.position.z-=z;
};

window.resetView=()=>{
camera.position.set(0,8,20);
controls.target.set(0,3,0);
};

// Hiệu ứng chuyển động
let t=0;

function animate(){
requestAnimationFrame(animate);
t+=.01;

petals.forEach((p,i)=>{
p.position.y+=Math.sin(t+i)*.003;
p.position.x+=Math.sin(t*.5+i)*.002;
});

controls.update();
renderer.render(scene,camera);
}

animate();

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>

<script>
let merit=0;

window.act=(msg)=>{
const toast=document.getElementById('toast');
toast.textContent=msg;
toast.style.display='block';

setTimeout(()=>toast.style.display='none',1800);

merit+=10;
document.getElementById('merit').textContent=
merit.toLocaleString('vi-VN');
};

let n=prompt('Hoan nghênh bạn đến Sơn Tự Online! Nhập pháp danh hoặc tên (có thể bỏ qua):');

if(n&&n.trim()){
document.getElementById('name').textContent=n.trim();
}
</script>
</body>
</html>
